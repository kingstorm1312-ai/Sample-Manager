name: Publish staged release

on:
  push:
    paths:
      - '.release/**/publish.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release request
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(find .release -type f -name publish.json | sort | tail -n 1)"
          test -n "$REQUEST"
          VERSION="$(jq -r '.version' "$REQUEST")"
          ASSET_NAME="$(jq -r '.assetName' "$REQUEST")"
          SHA256="$(jq -r '.sha256' "$REQUEST")"
          DOWNLOAD_URL="$(jq -r '.downloadUrl' "$REQUEST")"
          NOTES="$(jq -r '.notes // ("Sample Manager " + .version)' "$REQUEST")"
          DIR="$(dirname "$REQUEST")"
          test -n "$VERSION"
          test -n "$ASSET_NAME"
          test -n "$SHA256"
          test -n "$DOWNLOAD_URL"
          {
            echo "version=$VERSION"
            echo "assetName=$ASSET_NAME"
            echo "sha256=$SHA256"
            echo "downloadUrl=$DOWNLOAD_URL"
            echo "notes=$NOTES"
            echo "dir=$DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild and verify package
        id: package
        env:
          ASSET_NAME: ${{ steps.meta.outputs.assetName }}
          EXPECTED_SHA: ${{ steps.meta.outputs.sha256 }}
          DIR: ${{ steps.meta.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/$ASSET_NAME"
          cat "$DIR"/chunks/*.b64 | tr -d '\r\n ' | base64 --decode > "$ZIP"
          ACTUAL_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        id: manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.downloadUrl }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/update.json"
          jq -n \
            --arg version "$VERSION" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg sha256 "$SHA256" \
            --arg notes "$NOTES" \
            '{version:$version,downloadUrl:$downloadUrl,sha256:$sha256,mandatory:false,notes:$notes}' \
            > "$MANIFEST"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
          ZIP: ${{ steps.package.outputs.zip }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$ZIP" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "Sample Manager $VERSION" \
              --notes "$NOTES"
          fi
